---
title: News
layout: default
group: news
permalink: /news/
---

<h1>Lab News</h1>

<div class="container-fluid">

  {% for item in site.data.news %}
    <div class="mb-4">
      <h4>{{ item.title }}</h4>
      <p class="text-muted">{{ item.month }}</p>

      {% if item.image %}
        <img
          src="{{ item.image | relative_url }}"
          alt="{{ item.title }}"
          class="img-fluid rounded shadow-sm mb-3"
          style="max-width: 650px;"
        >
      {% endif %}

      <p>{{ item.text }}</p>
    </div>
    <hr>
  {% endfor %}

</div>
